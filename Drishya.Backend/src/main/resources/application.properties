spring.application.name=Drishya
# Render assigns the port and expects the process to bind whatever it is given.
# Hard-coding 8080 makes the service start, fail its health check, and be killed
# with no obvious reason in the logs.
server.port=${PORT:8080}

# --- database ---------------------------------------------------------------
# PostgreSQL 16 + PostGIS. `docker compose up -d db` from the repository root
# brings it up; the defaults below match that service.
#
# H2 used to be the default so the project ran with nothing installed. It was
# dropped when PostGIS landed: H2 has no spatial support whatsoever, and the
# geofence, the lane segments and the ETA engine are all PostGIS queries. A
# database that cannot answer ST_DWithin cannot run this application.
#
# Credentials come from the environment. Nothing real is ever committed here —
# in AWS these arrive as Beanstalk environment properties or from Secrets
# Manager.
# Port 5433: a locally installed PostgreSQL holds 5432 on this machine and
# would otherwise shadow the container for every connection from the host.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/drishya}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:drishya}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:drishya_local_only}

# A db.t4g.micro allows very few connections and the deploy target is one
# t3.micro instance. Five is enough for this workload and leaves headroom for
# psql and the migration runner.
# Neon's free compute allows few connections, and Render runs one small
# instance. Five is enough for this workload and leaves headroom for psql and
# the migration runner.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Neon suspends idle compute. A connection held open across a suspend comes back
# dead, and the default 30-minute idle timeout is long enough for that to happen
# between overnight requests. Recycling well inside the suspend window means the
# pool hands out a live connection rather than discovering a dead one mid-query.
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000

# --- schema -----------------------------------------------------------------
# Flyway owns the schema. Hibernate must not touch it: `update` cannot express
# a PostGIS geography column, a GiST index or a backfill, and it silently
# diverges between machines. `validate` would be the stricter choice but it
# trips on the geography columns Hibernate reads back as a generic type.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jpa.open-in-view=false

# --- prediction ------------------------------------------------------------
# How often active trips are re-estimated, in milliseconds.
#
# Configurable because it is the one knob that decides whether Neon's compute
# ever gets to suspend. A 60-second cycle keeps the database permanently awake,
# which is right when vehicles are moving and pure waste overnight on a free
# tier billed by compute-hour. Raise it, or stop the service, when nothing is
# running.
drishya.eta.cycle-ms=${ETA_CYCLE_MS:60000}

# Where a trained model is looked for. Absent is normal and means the heuristic
# serves. See ml/README.md.
drishya.eta.model-dir=${ETA_MODEL_DIR:models}

# Guards /api/v1/internal/training-data, which is cross-tenant and therefore
# cannot be exposed to a normal bearer token. Unset means the endpoint 404s.
drishya.internal.service-token=${INTERNAL_SERVICE_TOKEN:}

# --- concurrency ------------------------------------------------------------
# Position ingest is I/O-bound batch writing — a request thread spends its life
# waiting on the database, which is exactly the workload virtual threads exist
# for. Hibernate 7 no longer pins the carrier thread on a synchronized block,
# so this is safe here in a way it was not on Boot 3.
spring.threads.virtual.enabled=true

# --- json -------------------------------------------------------------------
# Timestamps cross the wire as epoch milliseconds, converted in Mapper. No
# Instant is ever handed to Jackson, so no date-format setting applies.
#
# (Boot 4 ships Jackson 3, where the old
# spring.jackson.serialization.write-dates-as-timestamps property is gone.)

# --- actuator ---------------------------------------------------------------
# Beanstalk's health check points at /actuator/health/readiness in Phase 6.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# --- logging ----------------------------------------------------------------
logging.level.com.drishya.backend=INFO
# Uncomment to see the SQL PostGIS actually receives — worth doing whenever a
# spatial query returns nothing and the reason is not obvious.
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Deployed frontend origins, comma separated. Empty locally.
drishya.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# --- api documentation ------------------------------------------------------
# Swagger UI at /swagger-ui.html. Neither this nor /v3/api-docs starts with
# /api/, so AuthTokenFilter lets them through unauthenticated by design.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.api-docs.path=/v3/api-docs

# --- security ---------------------------------------------------------------
# HS256 signing key, at least 32 characters. Unset means one is generated per
# boot, which signs everyone out on every restart — fine on a laptop, wrong on
# a platform that restarts on deploy and on idle wake.
#   openssl rand -base64 48
drishya.security.jwt-secret=${JWT_SECRET:}
