spring.application.name=Drishya.Backend
server.port=8080

# --- database ---------------------------------------------------------------
# H2 in memory by default: the project runs with nothing to install, and every
# restart rebuilds the seeded dataset from fixed seeds. Swap to the postgres
# profile when you want data that survives a restart.
spring.datasource.url=jdbc:h2:mem:drishya;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Browse the seeded data at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:drishya, user: sa, no password)
spring.h2.console.enabled=true

# --- json -------------------------------------------------------------------
# Nothing to configure. The frontend does date arithmetic on these values and
# feeds them to new Date(...), so timestamps must be epoch milliseconds — but
# that conversion happens in Mapper, which exposes them as plain longs. No
# Instant is ever handed to Jackson, so no date-format setting applies.
#
# (Spring Boot 4 ships Jackson 3, where the old
# spring.jackson.serialization.write-dates-as-timestamps property no longer
# exists at all.)

# --- logging ----------------------------------------------------------------
logging.level.com.drishya.backend=INFO
# Uncomment when a query looks slow or suspicious:
# logging.level.org.hibernate.SQL=DEBUG
