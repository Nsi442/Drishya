# Run with:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
#
# Data survives restarts here, so the seeder deliberately does nothing when it
# finds existing vendors — it will not overwrite a database you have used.
spring.datasource.url=jdbc:postgresql://localhost:5432/drishya
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=postgres

# `update` rather than `create-drop`: never drop a persistent schema on boot.
# For anything beyond local development, replace this with Flyway or Liquibase —
# Hibernate's schema generation is not a migration tool.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false
