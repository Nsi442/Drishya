server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # React Router does client-side routing, so a hard refresh on
    # /vendor/shipments asks nginx for a file that does not exist. Serve
    # index.html and let the router sort it out.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames, so they can be cached forever. index.html deliberately
    # is not — it is what points at the current hashes.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxied to the backend service so the browser stays on one origin and
    # CORS never enters into the compose setup, exactly as the Vite dev proxy
    # does in development.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Position batches from a dead-zone catch-up can be large and slow.
        proxy_read_timeout 120s;
    }

    location /actuator/health {
        proxy_pass http://api:8080/actuator/health;
    }
}
