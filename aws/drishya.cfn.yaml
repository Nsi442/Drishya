AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Drishya on AWS — one t3.micro running the API container, one db.t4g.micro
  running PostgreSQL 16 with PostGIS, and one CloudFront distribution serving
  the Vite bundle from S3 and proxying /api to the instance.

# WHAT IS DELIBERATELY NOT HERE, AND WHY
#
# No load balancer. CLAUDE.md rules out an ALB because it bills by the hour
# whether or not anything is using it, and this system does not need one: there
# is a single instance and no health-based routing to do. But HTTPS is not
# optional — browser geolocation refuses to run outside a secure context, so
# `source: BROWSER` positions only exist on a secure origin, and an HTTPS page
# calling an HTTP API is blocked outright as mixed content. CloudFront resolves
# that: it terminates TLS with a free certificate on its own domain, and it
# bills per request rather than per hour.
#
# No NAT gateway. The instance sits in a public subnet with a public IP and
# talks to ECR directly. A NAT gateway is the single most expensive thing people
# accidentally leave running in an account like this.
#
# No Multi-AZ, no read replica. Two subnets exist only because an RDS subnet
# group requires two availability zones; the database itself is single-AZ.
#
# ONE DISTRIBUTION, NOT TWO — this is the part worth understanding. The bundle
# and the API answer on the same origin, so the browser never makes a
# cross-origin request and CORS never enters into it. That is exactly how the
# Vite dev proxy behaves locally, and DEPLOYMENT.md names CORS as the first
# thing that breaks on a split deploy. It also means VITE_API_BASE stays at its
# default "/api" and the bundle is not built per environment.

Parameters:

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9!#$%^&*()_+=-]*"
    Description: >-
      Master password for the database. RDS rejects '/', '@', '"' and spaces.
      Generate one: openssl rand -base64 24 | tr -d '/@" ' | cut -c1-32

  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      HS256 signing key, at least 32 characters. The application REFUSES to
      start on a shorter one, and generates a random key per boot if it is
      absent — which signs every user out on every restart and deploy. Generate
      one: openssl rand -base64 48

  SshCidr:
    Type: String
    Default: ""
    Description: >-
      Optional CIDR allowed to reach port 22, e.g. 203.0.113.4/32. Leave empty
      and no SSH rule is created at all — use Session Manager instead, which the
      instance role already permits and which needs no open port and no key pair.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t4g.micro, t4g.small]
    Description: >-
      t3.micro is the documented target and is 1 GB of RAM. The JVM is capped
      below that in the container run command.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]

  ApiImageTag:
    Type: String
    Default: latest
    Description: Tag of the API image in the ECR repository this stack creates.

  CloudFrontPrefixListId:
    Type: String
    AllowedPattern: "pl-[0-9a-f]+"
    Description: >-
      The AWS-managed prefix list of CloudFront's origin-facing addresses. It is
      owned by AWS and cannot be created here, and its id differs per region, so
      it is looked up once and passed in:
        aws ec2 describe-managed-prefix-lists --region <region>
          --filters Name=prefix-list-name,Values=com.amazonaws.global.cloudfront.origin-facing
          --query 'PrefixLists[0].PrefixListId' --output text
      This is what keeps port 8080 closed to everything except the edge.

  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      Resolved at deploy time rather than pinned, so a stack created next year
      does not start from a year-old unpatched image.

Conditions:
  HasSsh: !Not [!Equals [!Ref SshCidr, ""]]

Resources:

  # --- network -------------------------------------------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      # Required. CloudFront reaches the instance by its public DNS name, and
      # without this the instance is not given one.
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  # Exists only to satisfy the RDS subnet group, which demands two zones even
  # for a single-AZ instance. Nothing is placed in it.
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # --- security groups -----------------------------------------------------

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Drishya API instance
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Only CloudFront may reach the API port. The managed prefix list is
        # maintained by AWS and covers every CloudFront edge; without it, port
        # 8080 would be open to the internet and the TLS the distribution
        # provides could simply be walked around.
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront edge locations only
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-api-sg" }]

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsh
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshCidr
      Description: Operator SSH

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Drishya database
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # The instance, and nothing else. Not a CIDR — a security group
        # reference, so it keeps holding when the instance is replaced and its
        # address changes.
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
          Description: API instance only
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db-sg" }]

  # --- database ------------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Drishya database subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    # Snapshot on delete would leave a billable artefact behind after the
    # teardown script says it is gone. This is demo data reseeded on every boot.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-db"
      Engine: postgres
      # A full minor, because RDS refuses a bare major for a NEW instance —
      # "16" alone is rejected, as are 16.4, 16.6 and 16.8, which have already
      # aged out. 16.10 is the newest 16.x that can still be created; check
      # before a fresh deploy, because this line is the one that expires:
      #   aws rds describe-db-engine-versions --engine postgres \
      #     --query 'DBEngineVersions[?starts_with(EngineVersion, `16.`)].EngineVersion'
      #
      # The MAJOR stays at 16 to match docker-compose.yml. A spatial query that
      # behaves on 17 locally and differently on 16 here is the fault that
      # surfaces the morning of a review, and Hibernate 7 can emit different SQL
      # than 6 for the same HQL — so the two majors move together or not at all.
      #
      # AutoMinorVersionUpgrade below keeps the running instance patched after
      # creation; this value only governs what it is created as.
      EngineVersion: "16.10"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: drishya
      MasterUsername: drishya
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      # The database is not on the internet. Everything that talks to it is
      # inside this VPC.
      PubliclyAccessible: false
      MultiAZ: false
      # No automated backups, and no minor-version upgrades. Both are the right
      # settings for a service that lives for years and the wrong ones for a
      # demo that lives for weeks.
      #
      # The seeder rebuilds this database from fixed seeds on every boot, so a
      # nightly snapshot preserves nothing that cannot be recreated in ninety
      # seconds — and enabling backups also opens a backup window, which is one
      # more span of time in which the database can be briefly slow while
      # somebody is presenting.
      #
      # Same reasoning for the upgrade: a minor-version upgrade restarts the
      # instance inside its maintenance window, and the cost of that landing
      # mid-demo is far higher than the cost of running three weeks on the minor
      # this was created with. Turn both back on for anything long-lived.
      BackupRetentionPeriod: 0
      AutoMinorVersionUpgrade: false

      # Pinned rather than left to AWS, which otherwise picks a window per
      # region that may sit squarely in the working day. 19:00-19:30 UTC is
      # after midnight in India, where the lanes in this data are.
      PreferredMaintenanceWindow: "Sun:19:00-Sun:19:30"

      DeletionProtection: false
      EnablePerformanceInsights: false

  # --- image registry ------------------------------------------------------

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-api"
      # So `cloudformation delete-stack` actually completes. Without it a
      # repository holding images refuses to delete and the stack hangs in
      # DELETE_FAILED with a database still billing beside it.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the last 5 images; storage is billed by the GB.",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
              "action": { "type": "expire" }
            }]
          }

  # --- instance ------------------------------------------------------------

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        # Shell access without an open port, a key pair, or a bastion. This is
        # what makes SshCidr optional rather than necessary.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ApiInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetA
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      MetadataOptions:
        # IMDSv2 only. The database password and the JWT secret reach the
        # instance through user data, which is readable from instance metadata;
        # requiring a session token is what stops a server-side request forgery
        # in the application from being enough to read them.
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-api" }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker
          systemctl enable --now docker

          REGISTRY="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
          aws ecr get-login-password --region ${AWS::Region} \
            | docker login --username AWS --password-stdin "$REGISTRY"

          # Written to a file rather than passed on the command line: docker
          # inspect shows the command line to anyone on the box, and this way
          # the secrets are in one root-owned file instead.
          install -m 600 /dev/null /etc/drishya.env
          cat > /etc/drishya.env <<ENV
          SPRING_DATASOURCE_URL=jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/drishya
          SPRING_DATASOURCE_USERNAME=drishya
          SPRING_DATASOURCE_PASSWORD=${DbPassword}
          JWT_SECRET=${JwtSecret}
          PORT=8080
          ETA_CYCLE_MS=60000
          DB_POOL_SIZE=5
          ENV

          IMAGE="$REGISTRY/${ApiRepository}:${ApiImageTag}"

          # Wait for the image rather than failing on it.
          #
          # The repository this stack creates is empty the moment it is created,
          # so on a first deploy there is nothing to pull yet. Without this the
          # instance boots, the pull fails once, and the box sits there looking
          # healthy with no API on it — which reads as a broken template rather
          # than a missing push. Now the stack and the image can be done in
          # either order, and a pull that fails because ECR blipped is retried
          # instead of being fatal.
          for attempt in $(seq 1 40); do
            if docker pull "$IMAGE"; then break; fi
            echo "image not available yet (attempt $attempt); waiting"
            sleep 30
          done

          # The image caps the heap at 320 MB for a 512 MB Render instance.
          # t3.micro is 1 GB, so the JVM is given more room here rather than
          # leaving it throttled by a setting tuned for a smaller host.
          docker run -d --name drishya-api --restart always \
            -p 8080:8080 \
            --env-file /etc/drishya.env \
            -e JAVA_TOOL_OPTIONS="-Xmx512m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC" \
            "$IMAGE"

  # --- static bundle -------------------------------------------------------

  WebBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Private throughout. The bundle is served by CloudFront through an origin
      # access control, never from the bucket's own endpoint — a public bucket
      # is an unversioned second copy of the site with no TLS story.
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${WebBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # --- edge ----------------------------------------------------------------

  SpaRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-spa-rewrite"
      AutoPublish: true
      FunctionConfig:
        Runtime: cloudfront-js-2.0
        Comment: Serve index.html for client-side routes, but never for a real file.
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          // A path with a dot is an asset request. It must keep its 404: a
          // missing JS chunk that silently returns index.html renders a blank
          // page and "Unexpected token '<'", which says nothing about the
          // actual cause.
          if (request.uri.indexOf('.') !== -1) {
            return request;
          }
          // Everything else is a React Router path — /vendor/shipments/SHP-1
          // exists in the browser and not in the bucket.
          request.uri = '/index.html';
          return request;
        }

  # Defined here rather than referencing AWS's managed policies by their opaque
  # UUIDs, so the template says what it does and cannot silently attach the
  # wrong policy.
  BundleCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-bundle"
        # Vite fingerprints every asset filename, so a long TTL is safe for
        # them. index.html is the one file that must not be pinned — it is what
        # points at the new fingerprints — and the invalidation on deploy is
        # what releases it.
        #
        # The reasoning lives in this YAML comment, not in Comment: below.
        # CloudFront caps that field at 128 characters and rejects the whole
        # stack when it is longer, with "The parameter Comment is too big" —
        # and cfn-lint does not measure it, so it passes every local check.
        Comment: Long TTL for fingerprinted assets; index.html is released by the deploy invalidation.
        DefaultTTL: 86400
        MinTTL: 0
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-api-no-cache"
        Comment: The API is never cached. Every response is per-tenant.
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 0
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: false
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-api-origin"
        # Without the Authorization header the API answers 401 to its own
        # frontend, and without the query strings every filter, sort and page
        # silently collapses to its default. Both are the whole point of this
        # policy. Kept short below for the 128-character cap — see the note on
        # BundleCachePolicy.
        Comment: Forwards the bearer token and every query parameter to the API.
        CookiesConfig: { CookieBehavior: none }
        QueryStringsConfig: { QueryStringBehavior: all }
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers: [Authorization, Content-Type, Accept, Origin, Referer]

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName} — bundle and API on one origin"
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100
        Origins:
          - Id: s3-bundle
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {}
          - Id: api-instance
            DomainName: !GetAtt ApiInstance.PublicDnsName
            CustomOriginConfig:
              # HTTP to the origin, HTTPS to the viewer. The instance has no
              # certificate of its own and the leg from the edge to it is inside
              # AWS, reachable only from CloudFront by the security group above.
              # A certificate on the instance would need a domain and a renewal
              # story for no gain the security group does not already give.
              OriginProtocolPolicy: http-only
              HTTPPort: 8080
              OriginReadTimeout: 30
        DefaultCacheBehavior:
          TargetOriginId: s3-bundle
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachePolicyId: !Ref BundleCachePolicy
          Compress: true
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SpaRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-instance
            ViewerProtocolPolicy: redirect-to-https
            # POST, PATCH and DELETE are all in use — position ingest, dock
            # assignment and stopping a simulated vehicle. A GET/HEAD-only
            # behaviour answers 403 to every write in the product.
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
            Compress: true
          - PathPattern: /actuator/*
            TargetOriginId: api-instance
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            Compress: false
        # NOTE: no CustomErrorResponses. It is the obvious way to do SPA routing
        # and it is wrong here — the setting is distribution-wide, so it would
        # also turn the API's 404s into index.html with status 200. This API
        # answers 404 rather than 403 for another tenant's record on purpose;
        # rewriting that to a 200 would break the contract and the frontend's
        # error handling at once. The viewer-request function above does the
        # rewrite on the bundle behaviour only.
        ViewerCertificate:
          # The free *.cloudfront.net certificate. Enough for HTTPS, which is
          # what browser geolocation and the non-mixed-content requirement need.
          # Bring your own domain by adding Aliases and an ACM certificate in
          # us-east-1.
          CloudFrontDefaultCertificate: true

Outputs:

  SiteUrl:
    Description: Open this. Frontend and API are both behind it.
    Value: !Sub "https://${Distribution.DomainName}"

  ApiHealth:
    Description: Readiness endpoint. Check this first if the site looks empty.
    Value: !Sub "https://${Distribution.DomainName}/actuator/health/readiness"

  BundleBucket:
    Description: Sync the Vite build output here, then invalidate the distribution.
    Value: !Ref WebBucket

  DistributionId:
    Description: Needed for cache invalidation after a frontend deploy.
    Value: !Ref Distribution

  EcrRepository:
    Description: Push the API image here.
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ApiRepository}"

  DbEndpoint:
    Description: Reachable only from the instance. Run db/rds-setup.sql against it.
    Value: !GetAtt Database.Endpoint.Address

  InstanceId:
    Description: "Shell in without SSH: aws ssm start-session --target <this>"
    Value: !Ref ApiInstance
