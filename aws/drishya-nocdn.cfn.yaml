AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Drishya on AWS, WITHOUT CloudFront — one t3.micro running both the nginx
  frontend container and the API container, and one db.t4g.micro running
  PostgreSQL 16 with PostGIS. Plain HTTP.

# WHY THIS VARIANT EXISTS
#
# CloudFront refuses to create resources in a brand-new AWS account until a
# human at AWS verifies it:
#
#   Your account must be verified before you can add new CloudFront resources.
#   To verify your account, please contact AWS Support
#
# That is an account state, not a template fault, and the support case takes
# hours. This deploys everything else in the meantime.
#
# WHAT IS THE SAME
# The browser still talks to ONE origin, so CORS still never enters into it.
# nginx does what the distribution did: it serves the bundle, rewrites unknown
# paths to index.html for React Router, and proxies /api to the API container
# over the container network. That configuration is not new — it is the same
# nginx.conf docker-compose has used all along.
#
# WHAT IS LOST, AND IT IS ONE THING
# HTTPS. The site answers on http://<instance>. Browser geolocation refuses to
# run outside a secure context, so positions with source BROWSER cannot be
# produced against this deployment. Everything else works: the server-side
# vehicle simulation, the geofences, the ETA engine, Start trip, the maps.
# OpenStreetMap tiles load fine — a page may pull HTTPS resources, it is the
# reverse that browsers block.
#
# Move to aws/drishya.cfn.yaml once the account is verified.

# WHAT IS DELIBERATELY NOT HERE, AND WHY
#
# No load balancer. CLAUDE.md rules out an ALB because it bills by the hour
# whether or not anything is using it, and this system does not need one: there
# is a single instance and no health-based routing to do. But HTTPS is not
# optional — browser geolocation refuses to run outside a secure context, so
# `source: BROWSER` positions only exist on a secure origin, and an HTTPS page
# calling an HTTP API is blocked outright as mixed content. CloudFront resolves
# that: it terminates TLS with a free certificate on its own domain, and it
# bills per request rather than per hour.
#
# No NAT gateway. The instance sits in a public subnet with a public IP and
# talks to ECR directly. A NAT gateway is the single most expensive thing people
# accidentally leave running in an account like this.
#
# No Multi-AZ, no read replica. Two subnets exist only because an RDS subnet
# group requires two availability zones; the database itself is single-AZ.
#
# ONE DISTRIBUTION, NOT TWO — this is the part worth understanding. The bundle
# and the API answer on the same origin, so the browser never makes a
# cross-origin request and CORS never enters into it. That is exactly how the
# Vite dev proxy behaves locally, and DEPLOYMENT.md names CORS as the first
# thing that breaks on a split deploy. It also means VITE_API_BASE stays at its
# default "/api" and the bundle is not built per environment.

Parameters:

  DbPassword:
    Type: String
    NoEcho: true
    MinLength: 16
    MaxLength: 41
    AllowedPattern: "[a-zA-Z0-9!#$%^&*()_+=-]*"
    Description: >-
      Master password for the database. RDS rejects '/', '@', '"' and spaces.
      Generate one: openssl rand -base64 24 | tr -d '/@" ' | cut -c1-32

  JwtSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: >-
      HS256 signing key, at least 32 characters. The application REFUSES to
      start on a shorter one, and generates a random key per boot if it is
      absent — which signs every user out on every restart and deploy. Generate
      one: openssl rand -base64 48

  SshCidr:
    Type: String
    Default: ""
    Description: >-
      Optional CIDR allowed to reach port 22, e.g. 203.0.113.4/32. Leave empty
      and no SSH rule is created at all — use Session Manager instead, which the
      instance role already permits and which needs no open port and no key pair.

  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small, t4g.micro, t4g.small]
    Description: >-
      t3.micro is the documented target and is 1 GB of RAM. The JVM is capped
      below that in the container run command.

  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small]

  ApiImageTag:
    Type: String
    Default: latest
    Description: Tag of the API image in the ECR repository this stack creates.

  LatestAmiId:
    Type: "AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>"
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: >-
      Resolved at deploy time rather than pinned, so a stack created next year
      does not start from a year-old unpatched image.

Conditions:
  HasSsh: !Not [!Equals [!Ref SshCidr, ""]]

Resources:

  # --- network -------------------------------------------------------------

  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      # Required. CloudFront reaches the instance by its public DNS name, and
      # without this the instance is not given one.
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-vpc" }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-igw" }]

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true

  # Exists only to satisfy the RDS subnet group, which demands two zones even
  # for a single-AZ instance. Nothing is placed in it.
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetARouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable

  SubnetBRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # --- security groups -----------------------------------------------------

  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Drishya API instance
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # Port 80, open. There is no CloudFront in front of this variant, so the
        # instance is the public face and nginx on it is what the browser talks
        # to. 8080 is deliberately NOT opened: the API is reached only through
        # nginx, on the container network, which is what keeps the browser on
        # one origin.
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: The site, over plain HTTP
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-api-sg" }]

  SshIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasSsh
    Properties:
      GroupId: !Ref ApiSecurityGroup
      IpProtocol: tcp
      FromPort: 22
      ToPort: 22
      CidrIp: !Ref SshCidr
      Description: Operator SSH

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Drishya database
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        # The instance, and nothing else. Not a CIDR — a security group
        # reference, so it keeps holding when the instance is replaced and its
        # address changes.
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ApiSecurityGroup
          Description: API instance only
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-db-sg" }]

  # --- database ------------------------------------------------------------

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Drishya database subnets
      SubnetIds: [!Ref SubnetA, !Ref SubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    # Snapshot on delete would leave a billable artefact behind after the
    # teardown script says it is gone. This is demo data reseeded on every boot.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub "${AWS::StackName}-db"
      Engine: postgres
      # A full minor, because RDS refuses a bare major for a NEW instance —
      # "16" alone is rejected, as are 16.4, 16.6 and 16.8, which have already
      # aged out. 16.10 is the newest 16.x that can still be created; check
      # before a fresh deploy, because this line is the one that expires:
      #   aws rds describe-db-engine-versions --engine postgres \
      #     --query 'DBEngineVersions[?starts_with(EngineVersion, `16.`)].EngineVersion'
      #
      # The MAJOR stays at 16 to match docker-compose.yml. A spatial query that
      # behaves on 17 locally and differently on 16 here is the fault that
      # surfaces the morning of a review, and Hibernate 7 can emit different SQL
      # than 6 for the same HQL — so the two majors move together or not at all.
      #
      # AutoMinorVersionUpgrade below keeps the running instance patched after
      # creation; this value only governs what it is created as.
      EngineVersion: "16.10"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: drishya
      MasterUsername: drishya
      MasterUserPassword: !Ref DbPassword
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      # The database is not on the internet. Everything that talks to it is
      # inside this VPC.
      PubliclyAccessible: false
      MultiAZ: false
      # No automated backups, and no minor-version upgrades. Both are the right
      # settings for a service that lives for years and the wrong ones for a
      # demo that lives for weeks.
      #
      # The seeder rebuilds this database from fixed seeds on every boot, so a
      # nightly snapshot preserves nothing that cannot be recreated in ninety
      # seconds — and enabling backups also opens a backup window, which is one
      # more span of time in which the database can be briefly slow while
      # somebody is presenting.
      #
      # Same reasoning for the upgrade: a minor-version upgrade restarts the
      # instance inside its maintenance window, and the cost of that landing
      # mid-demo is far higher than the cost of running three weeks on the minor
      # this was created with. Turn both back on for anything long-lived.
      BackupRetentionPeriod: 0
      AutoMinorVersionUpgrade: false

      # Pinned rather than left to AWS, which otherwise picks a window per
      # region that may sit squarely in the working day. 19:00-19:30 UTC is
      # after midnight in India, where the lanes in this data are.
      PreferredMaintenanceWindow: "Sun:19:00-Sun:19:30"

      DeletionProtection: false
      EnablePerformanceInsights: false

  # --- image registry ------------------------------------------------------

  WebRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-web"
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true

  ApiRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub "${AWS::StackName}-api"
      # So `cloudformation delete-stack` actually completes. Without it a
      # repository holding images refuses to delete and the stack hangs in
      # DELETE_FAILED with a database still billing beside it.
      EmptyOnDelete: true
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep the last 5 images; storage is billed by the GB.",
              "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 5 },
              "action": { "type": "expire" }
            }]
          }

  # --- logs ----------------------------------------------------------------

  LogGroup:
    Type: AWS::Logs::LogGroup
    # Deleted with the stack. A log group that outlives the thing it logged is
    # a bill nobody remembers agreeing to, and the teardown script would report
    # everything gone while this kept billing.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub "/drishya/${AWS::StackName}"
      # Seven days, because this is a demo that lives for weeks. Retention is
      # billed by the GB-month and "Never expire" is the console default, which
      # is how a forgotten log group becomes the largest line on a small bill.
      RetentionInDays: 7

  # --- instance ------------------------------------------------------------

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        # Shell access without an open port, a key pair, or a bastion. This is
        # what makes SshCidr optional rather than necessary.
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        # Scoped to this stack's own log group rather than the managed
        # CloudWatchAgentServerPolicy, which grants logs:* across the account
        # plus SSM parameter reads this instance has no use for.
        - PolicyName: ship-container-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${LogGroup.Arn}:*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref InstanceRole]

  ApiInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultRoute
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetA
      SecurityGroupIds: [!Ref ApiSecurityGroup]
      MetadataOptions:
        # IMDSv2 only. The database password and the JWT secret reach the
        # instance through user data, which is readable from instance metadata;
        # requiring a session token is what stops a server-side request forgery
        # in the application from being enough to read them.
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags: [{ Key: Name, Value: !Sub "${AWS::StackName}-api" }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail

          dnf install -y docker
          systemctl enable --now docker

          REGISTRY="${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com"
          aws ecr get-login-password --region ${AWS::Region} \
            | docker login --username AWS --password-stdin "$REGISTRY"

          # Written to a file rather than passed on the command line: docker
          # inspect shows the command line to anyone on the box, and this way
          # the secrets are in one root-owned file instead.
          install -m 600 /dev/null /etc/drishya.env
          cat > /etc/drishya.env <<ENV
          # The query string is not decoration; without it this deployment
          # has already been taken down once.
          #
          # socketTimeout: pgjdbc's default read timeout is infinite. An RDS
          # reboot drops established connections without a TCP reset, so a
          # checked-out connection blocks on read() forever and the pool of
          # five wedges permanently. Every probe stays green while every real
          # request hangs.
          #
          # reWriteBatchedInserts: documented at length in
          # application.properties and silently absent here, so the deployed
          # container was the one place that did not get it.
          SPRING_DATASOURCE_URL=jdbc:postgresql://${Database.Endpoint.Address}:${Database.Endpoint.Port}/drishya?reWriteBatchedInserts=true&socketTimeout=30&tcpKeepAlive=true&connectTimeout=10
          SPRING_DATASOURCE_USERNAME=drishya
          SPRING_DATASOURCE_PASSWORD=${DbPassword}
          JWT_SECRET=${JwtSecret}
          PORT=8080
          ETA_CYCLE_MS=60000
          DB_POOL_SIZE=5
          ENV

          API_IMAGE="$REGISTRY/${ApiRepository}:${ApiImageTag}"
          WEB_IMAGE="$REGISTRY/${WebRepository}:${ApiImageTag}"

          # nginx.conf proxies to http://api:8080 by that name, so the API
          # container must be called "api" on a user-defined network — that is
          # what gives Docker's embedded DNS a name to resolve. The default
          # bridge network has no DNS at all and the proxy would fail to
          # resolve, which nginx reports as 502 rather than as a name error.
          docker network create drishya 2>/dev/null || true

          # Wait for the image rather than failing on it.
          #
          # The repository this stack creates is empty the moment it is created,
          # so on a first deploy there is nothing to pull yet. Without this the
          # instance boots, the pull fails once, and the box sits there looking
          # healthy with no API on it — which reads as a broken template rather
          # than a missing push. Now the stack and the image can be done in
          # either order, and a pull that fails because ECR blipped is retried
          # instead of being fatal.
          for attempt in $(seq 1 40); do
            if docker pull "$API_IMAGE" && docker pull "$WEB_IMAGE"; then break; fi
            echo "images not available yet (attempt $attempt); waiting"
            sleep 30
          done

          # The image caps the heap at 320 MB for a 512 MB Render instance.
          # t3.micro is 1 GB, so the JVM is given more room here rather than
          # leaving it throttled by a setting tuned for a smaller host.
          # No -p on the API: it is reachable only from nginx, on the container
          # network. Publishing 8080 would expose an origin that bypasses the
          # proxy, on a box whose security group only expects port 80 to matter.
          # Container output goes to CloudWatch instead of Docker's local
          # json-file driver. Without this the only way to read an application
          # log is a shell on the box, which is exactly what is unavailable
          # when the account cannot open CloudShell or Session Manager.
          #
          # awslogs-create-group is deliberately absent: the group is a stack
          # resource above, so it is created with a retention policy and
          # deleted with the stack. Letting the driver create it would produce
          # a group that never expires and survives teardown.
          LOGOPTS="--log-driver awslogs \
            --log-opt awslogs-region=${AWS::Region} \
            --log-opt awslogs-group=${LogGroup}"

          docker run -d --name api --network drishya --restart always \
            $LOGOPTS --log-opt awslogs-stream=api \
            --env-file /etc/drishya.env \
            -e JAVA_TOOL_OPTIONS="-Xmx448m -XX:MaxMetaspaceSize=128m -XX:+UseSerialGC" \
            "$API_IMAGE"

          docker run -d --name web --network drishya --restart always \
            $LOGOPTS --log-opt awslogs-stream=web \
            -p 80:80 \
            "$WEB_IMAGE"

Outputs:

  SiteUrl:
    Description: Open this. HTTP, not HTTPS — see the note at the top of the template.
    Value: !Sub "http://${ApiInstance.PublicDnsName}"

  ApiHealth:
    Description: Readiness endpoint, through nginx. Check this first if the site looks empty.
    Value: !Sub "http://${ApiInstance.PublicDnsName}/actuator/health/readiness"

  EcrRepository:
    Description: Push the API image here.
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${ApiRepository}"

  WebEcrRepository:
    Description: Push the frontend image here.
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${WebRepository}"

  DbEndpoint:
    Description: Reachable only from the instance. Run db/rds-setup.sql against it.
    Value: !GetAtt Database.Endpoint.Address

  InstanceId:
    Description: "Shell in without SSH: aws ssm start-session --target <this>"
    Value: !Ref ApiInstance

  ApiLogStream:
    Description: >-
      Application log in the console, no shell needed. Filter for FORM-SUBMIT to
      see submitted form bodies.
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#logsV2:log-groups/log-group/$252Fdrishya$252F${AWS::StackName}/log-events/api"
